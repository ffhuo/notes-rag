# ─────────────────────────────────────────────────────────────
# notes-rag —— 使用 uv 管理依赖与虚拟环境
# uv：Rust 实现的极速 Python 包管理器，遵循标准 PEP 621 pyproject 格式。
# 本机 Python 命令约定：统一用 `python`（3.12）。
# 常用命令见 README「环境准备（uv）」。
# ─────────────────────────────────────────────────────────────

[project]
name = "notes-rag"
version = "0.1.0"
description = "知识库智能后端（RAG 应用）：把 Markdown 笔记变成可检索、可问答的 FastAPI 服务"
readme = "README.md"
requires-python = ">=3.12"
# 运行时依赖（与 docs/design.md 技术选型一致）
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "chromadb>=0.5",
    "openai>=1.30",
    # Agent 接入（MCP server，见 docs/design.md §10 模块索引 M09）
    # 2.x 起 FastMCP 更名为 MCPServer（from mcp.server.mcpserver import MCPServer），
    # 且 Streamable HTTP 的鉴权/session API 有变；app/mcp 按 2.x 编写，勿降到 1.x
    "mcp>=2.2,<3",
    "loguru>=0.7",
    # 图片处理（多模态索引）：本地图读取宽高 / 格式校验，见 docs/design.md 图片方案
    "pillow>=10.0",
    "python-docx>=1.2.0",
    "pymupdf>=1.28.2",
    # Excel(.xlsx/.xlsm) 解析（app/parsers/excel.py，见 docs/design.md §16.1）
    # openpyxl 只读 OOXML，不支持老式 .xls（pandas/xlrd 方案已停更，一期不覆盖）
    "openpyxl>=3.1",
]

# PEP 735 开发依赖组（不参与生产部署）
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "tenacity>=8.2",
    "rich>=13.0",
]

[tool.uv]
# 本项目是应用而非可发布库，禁止 uv 将自身 editable 安装为包
package = false
# 虚拟环境默认建在项目内 ./.venv，便于 IDE / 本机命令统一管理

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
